<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don Juba - Redirecionando...</title>
    <script>
      // Redireciona rotas SPA no GitHub Pages preservando o caminho na URL
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const isSubpath = window.location.hostname.endsWith('github.io') && pathSegments.length > 0;
      const basePath = isSubpath ? '/' + pathSegments[0] + '/' : '/';
      const redirectPath = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('redirect_path', redirectPath);
      window.location.replace(basePath);
    </script>
  </head>
  <body style="background-color: #07090E; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecionando para Don Juba...</p>
  </body>
</html>
