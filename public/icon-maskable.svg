      <stop offset="100%" stop-color="#151D2F"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3856"/>
      <stop offset="100%" stop-color="#E31837"/>
