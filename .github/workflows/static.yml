# Workflow para compilação e deploy da aplicação Vite/React no GitHub Pages
name: Deploy static content to Pages

on:
  # Executa automaticamente em pushes para a branch main
  push:
    branches: ["main"]

  # Permite execução manual pela aba Actions do GitHub
  workflow_dispatch:

# Permissões do GITHUB_TOKEN para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Compilar projeto (Vite Build)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dos artefatos compilados (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          # Pasta onde o index.html compilado e os assets são gerados
          path: './dist'

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
